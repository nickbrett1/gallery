# Homepage services.yaml entry for gallery
#
# `services.yaml` is a top-level LIST of groups, each group a list of cards.
# This repo's Homepage already declares a `Services` group in settings.yaml's
# `layout:` but has no such group in services.yaml yet, so paste the block
# below (column 0) between the `- Servers & Devices:` group and the
# `- System & Monitoring:` group — that is where the layout expects `Services`.
#
# Homepage runs with `network_mode: host`, so `127.0.0.1:<port>` reaches the
# NAS-published host port for the siteMonitor/widget, while `http://nas:` is
# what the browser resolves. The compose file carries NO `homepage.*` labels:
# a services.yaml card plus a Docker-label card for the same container would
# both show up.

- Services:
    - gallery:
        icon: mdi-palette
        href: http://nas:3012/explore
        description: Video-game books — concepts, images, browse
        server: local
        container: gallery
        siteMonitor: http://127.0.0.1:3012/health
        widget:
            type: customapi
            url: http://127.0.0.1:3012/health
            refreshInterval: 30000
            mappings:
                - field: status
                  label: Status
                - field: index.rows
                  label: Chunks
                  format: number
                - field: counts.books
                  label: Books
                  format: number
