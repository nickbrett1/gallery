# Docker Compose configuration for gallery
# Generated by genproj (docker-container capability).
#
# Deploy with: docker compose up -d
# (On Synology, import this file as a Container Manager "Project".)
#
# The image reference uses your registry namespace (GitHub username/org for
# GHCR). For public packages no registry credentials are required on the host.

services:
  app:
    image: ghcr.io/nickbrett1/gallery:latest
    container_name: gallery
    restart: unless-stopped

    ports:
      - "0.0.0.0:3012:3000"
    volumes:
      - /volume1/homes/nick/vg-books:/data:ro
    environment:
      # Set your environment variables here or in a NAS-side .env file
      # (genproj never commits secrets). See .env.example.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://nas:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      GALLERY_DATA: ${GALLERY_DATA:-/data}
      INDEX_BACKEND: ${INDEX_BACKEND:-lancedb}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      # Homepage: deliberately no `homepage.*` discovery labels. The fleet
      # convention is a services.yaml card bound to the container
      # (`server: local` + `container: gallery`), which also carries a
      # siteMonitor and a widget — see deploy/homepage-services.yaml. Any
      # `homepage.*` label here would make Homepage's Docker provider create a
      # SECOND card for the same service.
